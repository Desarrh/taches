[package]
name = "taches"
version = "0.2.0"
edition = "2024"
description = "Gestionnaire de tâches local pour Windows, inspiré de Microsoft To Do, en Rust"
license = "MIT"

[[bin]]
name = "taches"
path = "src/main.rs"

[dependencies]
egui = "0.37.0"
egui-winit = { version = "0.37.0", default-features = false, features = ["links"] }
winit = "0.30.13"
softbuffer = "0.4.8"
hdrshot-egui-backend = "0.2.0"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
socle = { git = "https://github.com/Desarrh/socle", tag = "v0.1.6", default-features = false, features = ["ui", "settings", "crash", "instance", "testmode"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell", "Win32_Media_Audio", "Win32_Graphics_Gdi",
] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
winresource = "0.1.34"
